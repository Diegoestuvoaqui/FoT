[platformio]
src_dir = src/firmware

; ============================================
; ESP32-WROOM-32 (esp32dev) - WiFi + MQTT + DHT22
; Broker: amqtt embebido en la estación (mDNS "FoT Broker")
; ============================================
[env:esp32_wifi_dht22]
platform = espressif32
board = esp32dev
framework = arduino

build_src_filter =
    +<sketches/esp32_wifi_dht22/main.cpp>
    +<sketches/esp32_wifi_dht22/ESP32_WIFI_DHT22.cpp>
    +<core/commands/*.cpp>
    +<core/sketches/*.cpp>
    +<core/communication/ESP32WiFiCommunication.cpp>
    +<core/communication/SerialCommunication.cpp>
    +<abstractSensors/*.cpp>
    -<core/communication/WiFiCommunication.cpp>
    -<core/communication/BluetoothCommunication.cpp>

lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.2.0
    knolleary/PubSubClient @ ^2.8

monitor_speed = 115200
upload_speed = 460800

