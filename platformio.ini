[platformio]
src_dir = src/firmware

; ============================================
; UNO R3 (ATmega328P) - Serial + DHT11
; Para SimulIDE o hardware real sin WiFi
; ============================================
[env:uno_r3_dht11]
platform = atmelavr
board = uno
framework = arduino

build_src_filter =
    +<sketches/uno_r3_dht11/main.cpp>
    +<sketches/uno_r3_dht11/UNOR3_DHT11_Sketch.cpp>
    +<core/**/*.cpp>
    +<abstractSensors/*.cpp>
    -<core/communication/MQTTCommunication.cpp>
    -<core/communication/WiFiCommunication.cpp>
    -<core/communication/BluetoothCommunication.cpp>

lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.2.0

monitor_speed = 115200

; ============================================
; UNO R4 WiFi (Renesas RA4M1) - WiFi + MQTT
; ============================================
[env:uno_r4_wifi_dht11]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino

build_src_filter =
    +<sketches/uno_r4_wifi_dht11/main.cpp>
    +<sketches/uno_r4_wifi_dht11/UNOR4_WIFI_DHT11.cpp>
    +<core/**/*.cpp>
    +<abstractSensors/*.cpp>

lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.2.0
    knolleary/PubSubClient @ ^2.8

monitor_speed = 115200



; ============================================
; LAFVIN R3 CH340 (ATmega328P) - Serial + DHT11
; Clon chino con CH340, solo comunicación USB
; ============================================
[env:lafvin_r3_ch340_dht11]
platform = atmelavr
board = uno
framework = arduino

build_src_filter =
    +<sketches/lafvin_r3_ch340_dht11/main.cpp>
    +<sketches/lafvin_r3_ch340_dht11/LAFVIN_R3_CH340_DHT11_Sketch.cpp>
    +<core/**/*.cpp>
    +<abstractSensors/*.cpp>
    -<core/communication/MQTTCommunication.cpp>
    -<core/communication/WiFiCommunication.cpp>
    -<core/communication/BluetoothCommunication.cpp>

lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.2.0

monitor_speed = 115200



[env:test_dht11_minimo]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

; Solo incluir el archivo del test, nada más
build_src_filter = +<sketches/test_dht11_minimo/main.cpp>

lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14